<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="./styles/reset.css"> -->
    <link rel="stylesheet" href="./styles/style.css">
    <title>Color Flipper</title>
</head>
<body>
    <header>
        <h1 class="h1-title">Color Flipper</h1>
    </header>
    <div class="buttons">
        <button value="green" class="buttonChangeColor green notSelected">Green</button>
        <button value="red" class="buttonChangeColor red notSelected">Red</button>
        <button value="blue" class="buttonChangeColor blue notSelected">Blue</button>
        <button value="random" class="buttonChangeColor random notSelected">Random</button>
    </div>
    <script type="module" src="./scripts/script.js" defer></script>
</body>
</html>
